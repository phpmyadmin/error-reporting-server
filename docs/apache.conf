# This will run the server on port 80, if you already have services on port 80
# you may wish to use a different port or configuration method.
#
# The document root is the webroot directory: the application code, the
# configuration and the logs have to stay out of it.
<VirtualHost *:80>
	ServerAdmin webmaster@localhost
	ServerName reports.phpmyadmin.net

	DocumentRoot /path/to/repo/dir/webroot/

	<Directory /path/to/repo/dir/webroot/>
		# The shipped .htaccess sends every request to index.php
		AllowOverride All
		Options Indexes MultiViews
		Require all granted
	</Directory>

	ErrorLog "/var/log/apache2/reports-error.log"
	CustomLog "/var/log/apache2/reports-access.log" common
</VirtualHost>
