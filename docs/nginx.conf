server {
	listen [::]:80;

	# The document root is the webroot directory: the application code, the
	# configuration and the logs have to stay out of it.
	root /home/reports/error-reporting-server/webroot/;
	index index.php;

	server_name reports.phpmyadmin.net;

	# To serve the application over HTTPS, add the two listen lines and the
	# certificate of the host. nginx refuses to start with a ssl listener that
	# has no certificate, so they are left out here.
	#	listen [::]:443 ssl;
	#	ssl_certificate /etc/letsencrypt/live/reports.phpmyadmin.net/fullchain.pem;
	#	ssl_certificate_key /etc/letsencrypt/live/reports.phpmyadmin.net/privkey.pem;

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to the front controller.
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		# With php8.4-fpm:
		fastcgi_pass unix:/var/run/php8.4-fpm-reports.sock;
		fastcgi_index index.php;
		include fastcgi_params;
	}
}
