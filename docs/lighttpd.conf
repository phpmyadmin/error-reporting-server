$HTTP["host"] =~ "^reports.phpmyadmin.net$" {
	# The document root is the webroot directory: the application code, the
	# configuration and the logs have to stay out of it.
	server.document-root = "/srv/http/reports.phpmyadmin.net/webroot/"

	# With php8.4-fpm:
	fastcgi.server = (
		".php" => ((
			"socket" => "/var/run/php8.4-fpm-reports.sock",
			"broken-scriptfilename" => "enable"
		))
	)

	url.rewrite-if-not-file = (
		"^([^\?]*)(\?(.+))?$" => "/index.php?url=$1&$3"
	)
}
