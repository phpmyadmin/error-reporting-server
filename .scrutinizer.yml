# scrutinizer-ci.com configuration
imports:
    - javascript
    - php
filter:
    excluded_paths:
        - webroot/
        - logs/
        - build/
        - node_modules/
        - tmp/
        - vendor/
checks:
    php: true
tools:
  external_code_coverage:
    runs: 1 # php 8.x versions
    timeout: 900 # 15 min

build:
  image: default-jammy # noble was not available on 12/09/2025
  nodes:
    analysis:
      environment:
        php: 8.4
      dependencies:
        before:
          # --dev so the tests can extend Cake\TestSuite\TestCase, which
          # inherits from PHPUnit
          - composer install --no-interaction --prefer-dist --optimize-autoloader --dev
      tests:
        override:
          - php-scrutinizer-run
          -
              command: php -d memory_limit=1G ./vendor/bin/phpstan analyze --error-format=checkstyle | sed '/^\s*$/d' > phpstan-checkstyle.xml
              analysis:
                  file: phpstan-checkstyle.xml
                  format: 'general-checkstyle'
          -
              command: php -d memory_limit=512M ./vendor/bin/phpcs --report=checkstyle --report-file=cs-data
              analysis:
                  file: 'cs-data'
                  format: 'php-cs-checkstyle'
